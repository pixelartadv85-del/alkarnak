# إعداد النشر التلقائي على Render.com (Blueprint)
services:
  - type: web
    name: aljalil
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/public/bootstrap
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: aljalil-data
      mountPath: /var/data
      sizeGB: 1
