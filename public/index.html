<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}">
  <meta name="theme-color" content="{{THEME}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESC}}">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="gfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Reem+Kufi:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/store.css">
  <style id="theme-vars"></style>
  <style id="custom-css"></style>
  <script>
    try { var t = localStorage.getItem('jalil-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="announce" class="announce" hidden></div>

  <header id="header" class="header">
    <div class="container header-inner">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="القائمة"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a href="#/" class="brand" id="brand"></a>
      <nav class="nav" id="nav"></nav>
      <div class="header-actions">
        <button class="icon-btn" id="searchBtn" aria-label="بحث"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <a class="icon-btn" href="#/account" aria-label="حسابي وطلباتي" title="حسابي وطلباتي"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="badge" id="acctBadge" hidden>0</span></a>
        <a class="icon-btn fav-link" href="#/favorites" aria-label="المفضلة"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.3 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.7 0 6 3.8 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg><span class="badge" id="favCount" hidden>0</span></a>
        <button class="icon-btn cart-btn" id="cartBtn" aria-label="السلة"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg><span class="badge" id="cartCount" hidden>0</span></button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav" hidden>
    <div class="mobile-nav-panel">
      <div class="mobile-nav-head"><strong id="mobileBrand"></strong><button class="icon-btn" data-close aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div id="mobileLinks"></div>
    </div>
  </div>

  <main id="app" tabindex="-1"></main>

  <footer class="footer" id="footer"></footer>

  <!-- السلة الجانبية -->
  <div class="drawer-backdrop" id="cartBackdrop" hidden></div>
  <aside class="drawer" id="cartDrawer" aria-label="سلة التسوق">
    <div class="drawer-head">
      <h3>سلة التسوق</h3>
      <button class="icon-btn" id="cartClose" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-foot" id="cartFoot"></div>
  </aside>

  <!-- البحث -->
  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-box">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="ابحث عن عشبة، زيت، كريم…" autocomplete="off">
        <button class="icon-btn" data-close aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <!-- الإعلان المنبثق -->
  <div class="popup" id="popup" hidden></div>

  <!-- أزرار عائمة -->
  <div class="floaters">
    <a class="float-btn wa" id="waFloat" target="_blank" rel="noopener" aria-label="واتساب" hidden><svg viewBox="0 0 32 32"><path fill="currentColor" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.5-5.6-1.5l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8.9 3.9.8a3.2 3.2 0 0 0 2.1-1.5 2.6 2.6 0 0 0 .2-1.5c-.1-.1-.3-.2-.7-.4z"/></svg></a>
    <a class="float-btn ai" id="aiFloat" href="#/advisor" aria-label="المستشار الذكي" hidden><span class="ai-pulse"></span><svg viewBox="0 0 24 24"><path d="M12 3c-4.4 0-8 3-8 6.8 0 2.2 1.2 4.1 3 5.3V20l3.6-2.4c.5.1.9.1 1.4.1 4.4 0 8-3 8-6.8S16.4 3 12 3z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg></a>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="/js/commerce.js"></script>
  <script src="/js/store.js"></script>
</body>
</html>
